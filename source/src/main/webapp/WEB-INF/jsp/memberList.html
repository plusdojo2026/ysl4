<!-- <%@ page language="java" contentType="text/html; charset=UTF-8"
    pageEncoding="UTF-8"%>
<%@ taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core" %>  -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>メンバー管理</title>
<link rel="stylesheet" href="/webapp/css/common.css">
<link rel="stylesheet" href="/webapp/css/member.css">
<!-- ${pageContext.request.contextPath}/css/common.css -->
</head>

<body>
<header>
<!-- <%@ include file="/WEB-INF/jsp/header.jsp" %> -->
</header>
<footer>
<!-- <%@ include file="/WEB-INF/jsp/footer.jsp" %> -->
</footer>	
		
	<div class ="main">
		<div class="under-header">
		 <img class="regist-elephant" src="/webapp/img/elephant(1).png">
			<div class="text-wrap">	
			<h3>メンバー一覧</h3>
        	<h4>登録済みのメンバーの登録・確認・編集ができます。</h4>
			<p>管理者専用</p>
			<input type="submit" class="regist-btn" name="regist-btn" value="メンバー登録">
			</div>
		</div>
		<div class="member-dashboard">			
			<div class="member-count">
				<img src="/webapp/img/people.png" width="100px" height="100px">
				<span>
				  <span class="block-box">総メンバー数</span>
				  <span class="actual-member-count">9</span>人
				</span>
			</div>
			<div class="member-count">
				<img src="/webapp/img/validmember.png" width="100" height="90">
				<span>
				  <span>有効メンバー数</span>
				  <span class="actual-member-count">7</span>人</div>
				</span>
			</div>
			<div class="member-count">
				<img src="/webapp/img/adminuser.png" width="80" height="90">
				<span>
				<span>管理者数</span>
				<span class="actual-member-count">2</span>人</div>

			<div class="member-count"><img src="/webapp/img/invalidmember.png" width="100" height="90">
				<span>無効メンバー数</span>
				<span class="actual-member-count">1</span>人</div>
		</div>   
            <!-- <span class="msg">${msg}</span> -->
			<form> 
                <!-- method="POST" action="<c:url value='/Controller'/>" -->
				<input type="hidden" name="page_id" value="M001">
				<div class="member-search">
				<table>
					<tr>
						<td>キーワード</td>
						<td><input type="text" class="keyword" name="keyword" value="" placeholder="氏名などで検索"></td>
                        <!-- value="${param.id }"				 -->
						<td>権限</td>
						<td>
						 <select>
							<option>一般ユーザー</option><!-- <c:if test="${param.kan == '0'}">checked</c:if> -->
							<option>管理者</option> <!-- <c:if test="${param.kan == '1'}" -->
						 </select>
						</td>
						<td>状態</td>
						<td>
						 <select>
							<option>有効</option>
							<option>無効</option>
						 </select>
						</td>                 					  
						<td colspan="2">
                          <input type="submit" class="submit-btn" name="button_id" value="検索" onclick="return regist()">
						  <input type="reset" class="clear-btn" name="button_id" value="クリア">
						</td>						  
					</tr>
				</table>
				</div>
			</form>	
		  <div class="member-list">
			<table border="1" id="foo-table" class="table table-bordered">
			 <thead>
			  <tr>
				<th>ログインID</th>
				<th>氏名</th>
				<th>メールアドレス</th>
				<th>権限</th>
				<th>状態</th>
				<th>登録日</th>
				<th>操作</th>
			  </tr>
			 </thead>
			 <tbody>
				<c:forEach var="e" items="${list}" varStatus="status">
			   <tr>
				<td>aaaa</td><--! <td>${e.empId}</td> -->
				<td>山田</td>
				<td>valuekfj</td>
				<td><span>一般</span></td>
				<td><span>有効</span></td>
				<td>7/27</td>
				<td><input type="submit" class="edit-btn" name="button_id" value="編集" onclick="return edit()"></td>
			   </tr>
			    </c:forEach>
			  </tbody>
			</table>
		  </div>

	</div>

	<script src="https://cdn.datatables.net/t/bs-3.3.6/jqc-1.12.0,dt-1.10.11/datatables.min.js"></script>
 <script>
    jQuery(function($){
    	//   デフォルトの設定を変更（日本語化）--------------------
        $.extend( $.fn.dataTable.defaults, {
            language: {
                url: "http://cdn.datatables.net/plug-ins/9dcbecd42ad/i18n/Japanese.json"
            }
        });
    	 //------------------------------------------------
		//データテーブルを使用
		$("#foo-table").DataTable({
		paging: true,        // ページング
		searching: true,    // 検索ボックス
		ordering: true,     // ソート（列ヘッダクリック）
		info: true,         // "〜件中 〜件を表示"の表示
		lengthChange: true  // 表示件数変更プルダウン
		})
	});
 </script>
</body>
</html>
